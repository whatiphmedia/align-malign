name: Build Windows VST3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time: a newer push cancels the older build, so two runs never publish at once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:GITHUB_WORKSPACE\build\_deps\Nuget"
          # fallback location JUCE also searches
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force -ErrorAction SilentlyContinue | Out-Null
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force -ErrorAction SilentlyContinue | Out-Null

      - name: Build the interface page
        run: python tools/build_ui.py

      - name: Configure
        run: cmake -B build -S . -A x64 -DALIGNMALIGN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel --target am_engine_test am_convolver_test am_latency_test am_groups_test am_solver_test am_phantom_test AlignMalign_VST3 AlignMalign_Standalone

      - name: Engine tests
        run: |
          build\Release\am_engine_test.exe
          build\Release\am_convolver_test.exe
          build\Release\am_latency_test.exe
          build\Release\am_groups_test.exe
          build\Release\am_solver_test.exe
          build\Release\am_phantom_test.exe

      - name: Package
        shell: pwsh
        run: |
          $art = "build/AlignMalign_artefacts/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "$art/VST3/Auto Malign.vst3" "dist/Auto Malign.vst3"
          Copy-Item "$art/Standalone/Auto Malign.exe" "dist/Auto Malign (standalone).exe"
          Copy-Item docs/INSTALL.md dist/INSTALL.md
          New-Item -ItemType Directory -Force "dist/Ableton Live control surface/AutoMalign" | Out-Null
          Copy-Item live/AutoMalign/__init__.py "dist/Ableton Live control surface/AutoMalign/__init__.py"
          Compress-Archive -Path dist/* -DestinationPath AutoMalign-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AutoMalign-Windows-x64
          path: AutoMalign-Windows-x64.zip

      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoMalign-Windows-x64.zip

      - name: Publish the Latest build (every push to main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the release outright, so its date, commit and tag are this build's and it shows as Latest.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          # the tag can outlive the release (e.g. after an interrupted run): remove it explicitly
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" 2>/dev/null || true
          short="${GITHUB_SHA:0:7}"
          when="$(date -u '+%Y-%m-%d %H:%M UTC')"
          gh release create latest AutoMalign-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Latest build ($when, $short)" \
            --notes "Built automatically from the newest commit on main ($GITHUB_SHA). Download AutoMalign-Windows-x64.zip below; install steps are in INSTALL.md inside the zip."
