<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Malign UI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--grad:linear-gradient(90deg,#39e6b0,#00d6ff 25%,#69aeff 50%,#cb7cff 75%,#ff4fa3);
  --bg:#050505; --line:#f2f2f2; --dim:#5c5c5c; --faint:#262626; --text:#f2f2f2; --muted:#9a9a9a;
  --align:#39e6b0; --malign:#ff4fa3;
  --hatch:repeating-linear-gradient(-45deg,var(--line) 0 4px,transparent 4px 10px);
  --hatch-dim:repeating-linear-gradient(-45deg,#3a3a3a 0 3px,transparent 3px 9px);
  --m:0;
  --ui:"Archivo","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:500 14px/1.35 var(--ui);font-stretch:108%;display:flex;align-items:safe center;justify-content:center;padding:18px;min-height:100%}

/* ---------- brackets: the grouping device (no boxed panels) ---------- */
.br{position:relative;
  background:
   linear-gradient(var(--line),var(--line)) 0 0/14px 1.5px, linear-gradient(var(--line),var(--line)) 0 0/1.5px 14px,
   linear-gradient(var(--line),var(--line)) 100% 0/14px 1.5px, linear-gradient(var(--line),var(--line)) 100% 0/1.5px 14px,
   linear-gradient(var(--line),var(--line)) 0 100%/14px 1.5px, linear-gradient(var(--line),var(--line)) 0 100%/1.5px 14px,
   linear-gradient(var(--line),var(--line)) 100% 100%/14px 1.5px, linear-gradient(var(--line),var(--line)) 100% 100%/1.5px 14px;
  background-repeat:no-repeat}
.lbl-tab{position:absolute;left:22px;top:-8px;padding:0 8px;background:var(--bg);font:800 12.6px/16px var(--ui);font-stretch:125%;letter-spacing:.02em;text-transform:uppercase;color:#fff}

/* ---------- flat buttons: slanted tabs ---------- */
button{font:650 13px/1 var(--ui);font-stretch:112%;color:var(--text);cursor:pointer;background:transparent;border:1.5px solid var(--line);border-radius:0;padding:8px 14px;transform:skewX(-16deg)}
button>.sk{display:inline-block;transform:skewX(16deg)}
button:hover{background:var(--hatch-dim)}
button[aria-pressed="true"],button[aria-current="true"]{background:var(--line);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px dashed var(--line);outline-offset:4px}
.knob:focus,.knob:focus-visible,.ed:focus,.ed:focus-visible{outline:none}
/* ---------- frame ---------- */
.plugin{width:100%;max-width:1340px;display:grid;gap:18px;padding:18px 20px;grid-template-columns:minmax(0,1fr) 210px;grid-template-areas:"head head" "stage flav" "deck flav" "status status"}
.plugin.is-pro{grid-template-columns:1fr 400px;grid-template-rows:auto auto 1fr auto;grid-template-areas:"head head" "pro stage" "pro side" "status status"}
header{grid-area:head;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px;
  background:linear-gradient(var(--line),var(--line)) 0 100%/180px 3px no-repeat,linear-gradient(var(--dim),var(--dim)) 0 100%/100% 1px no-repeat}
.wordmark{margin-right:auto;font:800 24px/1 var(--ui);font-stretch:125%;letter-spacing:.01em;white-space:nowrap}
.wordmark i{font-style:normal;font-weight:300;color:var(--muted);margin:0 2px}
.seg{display:inline-flex;gap:2px}
.tools{display:flex;gap:2px}
.focus{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--ui);cursor:pointer}

/* ---------- viewport ---------- */
.stage{grid-area:stage;position:relative;aspect-ratio:16/9;background-color:#000;padding:0}
.stage .well{position:absolute;inset:10px;overflow:hidden;border:1px solid var(--dim)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .lbl-tab{z-index:2}
.stage .focus-note{position:absolute;inset:10px;display:none;place-items:end start;padding:14px;pointer-events:none}
.is-focus .stage .focus-note{display:grid}
.focus-note span{background:var(--bg);border:1.5px solid var(--line);padding:6px 10px;font:600 12px var(--ui)}

/* ---------- main deck ---------- */
.deck{grid-area:deck;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:22px;align-items:stretch}
.macros{display:flex;gap:10px;justify-content:space-around;align-items:center;padding:24px 14px 16px}
.mk{display:flex;flex-direction:column;align-items:center;gap:8px;width:118px}
.mk .lbl{font:650 13px/1 var(--ui);font-stretch:112%}
.mk .val{font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--align)}
.knob{touch-action:none;cursor:grab;border-radius:50%;position:relative}
.knob .emblem{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.knob:active{cursor:grabbing}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:22px 20px 18px}
.hero .read{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero .ends{display:flex;justify-content:space-between;font:650 12px/1 var(--ui);font-stretch:118%;color:var(--muted)}
.hero .readout{font:300 46px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .readout b{font-weight:500}
.hero .sub{font:500 12px/1.3 var(--mono);color:var(--muted)}
.hero .bar{height:14px;position:relative;border:1px solid var(--dim);background:linear-gradient(90deg,#39e6b0,#00d6ff 25%,#69aeff 50%,#cb7cff 75%,#ff4fa3);background-clip:padding-box}
.hero .bar::before{content:"";position:absolute;inset:0;background:rgba(5,5,5,.78)}
.hero .bar i{position:absolute;top:-1px;bottom:-1px;background:inherit;background-size:var(--bw,100%) 100%;background-position:var(--bx,0) 0;box-shadow:0 0 10px rgba(255,255,255,.15)}
.hero .bar::after{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:1.5px;background:var(--line)}
.flavor{grid-area:flav;display:grid;grid-template-columns:1fr;grid-auto-rows:auto;gap:10px;padding:34px 0 22px 22px;align-content:space-between}
.is-pro .flavor{display:none}
.flavor button{transform:none;border:0;border-radius:0;height:66px;padding:0 0 0 16px;text-align:left;display:flex;flex-direction:column;justify-content:center;
  -webkit-mask-image:linear-gradient(90deg,#000 60%,transparent 100%);mask-image:linear-gradient(90deg,#000 60%,transparent 100%);
  box-shadow:inset 3px 0 0 var(--line),inset 0 1.5px 0 var(--line),inset 0 -1.5px 0 var(--line)}
.flavor button>.sk{transform:none;font:800 var(--flv-fs,24px)/.9 var(--ui);font-stretch:125%;letter-spacing:-.025em;text-transform:uppercase;white-space:nowrap}
.flavor button[aria-pressed="true"]{color:#050505;box-shadow:inset 7px 0 0 #39e6b0,inset 0 1.5px 0 var(--line),inset 0 -1.5px 0 var(--line)}
.flavor button:hover:not([aria-pressed="true"]){background:rgba(28,28,28,.85)}
.flavor button>.sk{display:block}
.flavor button small{display:block;font:500 9.5px/1.2 var(--mono);font-stretch:100%;letter-spacing:.08em;text-transform:uppercase;color:#d2d2d2;margin-top:7px;white-space:nowrap}
.flavor button[aria-pressed="true"] small{color:#3a3a3a}

/* ---------- status ---------- */
.status{grid-area:status;display:grid;grid-template-columns:auto 1fr auto auto;gap:18px;align-items:center;padding:18px 16px 12px;font:500 12px/1.45 var(--ui)}
#pyr{display:block}
.pyrbox{display:flex;align-items:center;gap:10px}
.pyrbox .cap{font:500 11px/1.35 var(--mono);color:var(--muted)}
.pyrbox .cap b{color:var(--text);font-weight:500}
#log{display:flex;flex-direction:column;gap:1px;min-width:0;font-family:var(--mono);font-size:11.5px}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log .err{color:var(--malign)}#log .warn{color:#ffd23f}
.meters{display:flex;flex-direction:column;gap:6px}
.meter{display:flex;align-items:center;gap:8px;font:600 11px var(--mono)}
.meter i{display:block;width:120px;height:10px;border:1px solid var(--dim);background:repeating-linear-gradient(90deg,transparent 0 5px,#141414 5px 7px);overflow:hidden}
.meter i b{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 7px)}
/* demo tools of the stand-alone prototype; inside the plugin the real signal drives everything */
.in-plugin #aud,.in-plugin #sweep,.in-plugin #perf{display:none}
#perf{white-space:nowrap;cursor:pointer;font:500 11px var(--mono);color:var(--muted)}
.src{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#sig{font:500 11px var(--mono);color:var(--muted);margin-right:6px}

/* ---------- pro page ---------- */
.pro{grid-area:pro;display:none;grid-template-columns:170px 1fr;gap:20px;min-height:0;padding:22px 16px 16px}
.is-pro .pro{display:grid}.is-pro .deck{display:none}
.side{grid-area:side;align-self:start;display:none;padding:24px 14px 14px;gap:10px;flex-direction:column;align-items:center}
.is-pro .side{display:flex}
.rail{display:flex;flex-direction:column;gap:4px}
.rail button{text-align:left;transform:none;border:0;border-left:3px solid transparent;padding:9px 10px}
.rail button>.sk{transform:none}
.rail button:hover{background:var(--hatch-dim)}
.rail button[aria-current="true"]{background:var(--faint);color:var(--text);border-left-color:var(--line)}
.panel{overflow:auto;max-height:580px;padding-right:4px}
.panel h2{font:800 22px/1.1 var(--ui);font-stretch:125%;margin:0 0 4px}
.panel p.lead{margin:0 0 16px;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1.5px solid var(--line);background:linear-gradient(var(--faint),var(--faint)) 0 0/100% 100% no-repeat}
.field .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field label,.field .name{font:650 13px/1.2 var(--ui)}
.field output{color:var(--align);white-space:nowrap;font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums}
.field .hint{font-size:12px;color:var(--muted);margin:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border:1px solid var(--dim);background:linear-gradient(90deg,transparent var(--fill,50%),rgba(5,5,5,.78) var(--fill,50%)),var(--grad)}
input[type=range]::-moz-range-track{height:6px;border:1px solid var(--dim);background:linear-gradient(90deg,transparent var(--fill,50%),rgba(5,5,5,.78) var(--fill,50%)),var(--grad)}
input[type=range]::-moz-range-progress{height:6px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:20px;margin-top:-7px;background:var(--line);border:0}
input[type=range]::-moz-range-thumb{width:8px;height:20px;background:var(--line);border:0;border-radius:0}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:650}
.switch input{appearance:none;width:44px;height:20px;border:1.5px solid var(--line);background:transparent;position:relative;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:13px;background:var(--dim);transition:left .1s}
.switch input:checked{background:var(--hatch-dim)}.switch input:checked::after{left:25px;background:var(--line)}
select{font:500 13px var(--mono);border:1.5px solid var(--line);border-radius:0;padding:6px 8px;background:var(--bg);color:var(--text)}
table.groups{width:100%;border-collapse:collapse}
table.groups td{padding:8px 4px;border-bottom:1px solid var(--dim)}
table.groups td:first-child{font-weight:650;width:166px}
table.groups .gname{display:block;font-weight:650;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.groups .gkind{display:block;font-size:11px;color:var(--muted);margin-top:2px}
table.groups .gout{font-size:12px;color:var(--muted)}
table.groups td.gempty{color:var(--muted);font-size:12px}
.chips{display:flex;gap:2px}
.chips button{padding:5px 12px;font-size:12px}
.side .mini{font:400 54px/1 var(--mono);letter-spacing:-.02em;color:var(--align);white-space:nowrap}
.side-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;width:100%}
.side-top>.knob{margin-left:-7px}
.side-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.side-sub{margin:0;font:500 16px/1.4 var(--mono);color:var(--text)}
.macrolist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;margin:8px 0 0;width:100%}
.macrolist .mrow{display:flex;justify-content:space-between;align-items:baseline}
.macrolist input[type=range]{margin-top:8px}
.macrolist>div{border-top:1.5px solid var(--line);padding:8px 2px 2px;text-align:left}
.macrolist dt{font:650 13px/1 var(--ui)}.macrolist dd{margin:0;font:500 13px/1 var(--mono);color:var(--align)}

/* ---------- reactive backgrounds (grid scan / holo mosaic) ---------- */
.fx{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);z-index:0;pointer-events:none;display:block}
.macros,.hero,.flavor,.pro{isolation:isolate}
.pro>*:not(.fx){position:relative;z-index:1}
.pro>.lbl-tab{position:absolute;z-index:2}
.pro>canvas.fx{position:absolute}
.macros>*:not(.fx),.hero>*:not(.fx),.flavor>*:not(.fx){position:relative;z-index:1}
.macros>.lbl-tab,.hero>.lbl-tab,.flavor>.lbl-tab{position:absolute;z-index:2}
/* keep-out margins: the background never touches a control */
.mk .lbl,.mk .val{padding:3px 8px}
.hero .read{padding:10px 12px}
.flavor button{background-color:rgba(5,5,5,.85)}
.flavor button[aria-pressed="true"]{background-color:var(--line)}
/* editable values */
.ed{cursor:text}
.ed:focus-visible{outline:0}
input.ed-in:focus-visible,input.ed-in:focus{outline:0}
.ed-in::selection{background:rgba(57,230,176,.28);color:var(--align)}
.ed-in{font:inherit;color:inherit;background:transparent;border:0;outline:0;padding:0;width:5ch;text-align:center;letter-spacing:inherit;caret-color:var(--align)}
.hero .readout .ed-in{width:5ch;font-size:42px}
@media (max-width:860px){.plugin.is-pro{grid-template-columns:1fr;grid-template-areas:"head" "stage" "side" "pro" "status"}.plugin:not(.is-pro){grid-template-columns:1fr;grid-template-areas:"head" "stage" "deck" "flav" "status"}.flavor{grid-template-columns:repeat(4,1fr);grid-auto-rows:auto}.deck{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.pro{grid-template-columns:1fr}.status{grid-template-columns:1fr}.hero{grid-template-columns:1fr;justify-items:center}}
@media (prefers-reduced-motion:reduce){.switch input::after{transition:none}}
</style>
</head>
<body>
<div class="plugin" id="plugin">
  <header>
    <div class="wordmark">AUTO MALIGN</div>
    <div class="seg" role="group" aria-label="Where the plugin is working" id="scope">
      <button aria-pressed="true" data-v="session" title="Moving a control here moves it on every copy set to Session">Session</button><button aria-pressed="false" data-v="track" title="Controls on this window only affect this track (a group still moves together)">This track</button>
    </div>
    <div class="tools">
      <button id="ab" aria-pressed="false" title="Hear the original, delayed to line up (bypass)">A/B</button>
      <button id="delta" aria-pressed="false" title="Hear only what the processing changes">Delta</button>
    </div>
    <label class="switch focus" title="Stops all animation. The view still updates when you change a control."><input type="checkbox" id="focus"><span>Focus mode</span></label>
    <div class="seg page" role="tablist" aria-label="Page">
      <button id="page-main" role="tab" aria-pressed="true" aria-selected="true">Main</button><button id="pro" role="tab" aria-pressed="false" aria-selected="false">Pro</button>
    </div>
  </header>

  <div class="stage br"><span class="lbl-tab">Session view</span><div class="well"><canvas id="scene" role="img" aria-label="Pixel-art farm diorama with a bunny and a rainbow. Turning toward Malign, a 3D editor takes the world apart and a low-poly face steals the rainbow's colours. Click the bunny to pet it."></canvas></div>
    <div class="focus-note"><span>Focus mode · animation off</span></div></div>

  <section class="deck" aria-label="Main controls">
    <div class="macros br" data-fx="grid"><canvas class="fx" aria-hidden="true"></canvas><span class="lbl-tab">Tone</span>
      <div class="mk"><div class="knob" id="k-match" tabindex="0"></div><div class="lbl">Match</div><div class="val" id="v-match"></div></div>
      <div class="mk"><div class="knob" id="k-width" tabindex="0"></div><div class="lbl">Width</div><div class="val" id="v-width"></div></div>
    </div>
    <div class="hero br" data-fx="grid"><canvas class="fx" aria-hidden="true"></canvas><span class="lbl-tab">Malignment</span>
      <div class="knob" id="k-main" tabindex="0"></div>
      <div class="read">
        <div class="ends"><span>Align</span><span>Malign</span></div>
        <div class="bar" aria-hidden="true"><i id="hbar"></i></div>
        <div class="readout" id="readout">Neutral</div>
        <div class="sub" id="hsub">Tracks summed as recorded</div>
      </div>
    </div>
    <div class="macros br" data-fx="grid"><canvas class="fx" aria-hidden="true"></canvas><span class="lbl-tab">Feel</span>
      <div class="mk"><div class="knob" id="k-motion" tabindex="0"></div><div class="lbl">Motion</div><div class="val" id="v-motion"></div></div>
      <div class="mk"><div class="knob" id="k-mix" tabindex="0"></div><div class="lbl">Mix</div><div class="val" id="v-mix"></div></div>
    </div>
  </section>
  <div class="flavor br" role="group" aria-label="Flavour" data-fx="mosaic"><canvas class="fx" aria-hidden="true"></canvas><span class="lbl-tab">Flavour</span>
      <button aria-pressed="true" data-flv="FUSE">Fuse<small>merge tracks</small></button>
      <button aria-pressed="false" data-flv="ERASE">Erase<small>cancel overlaps</small></button>
      <button aria-pressed="false" data-flv="GHOST">Ghost<small>smeared echoes</small></button>
      <button aria-pressed="false" data-flv="PHANTOM">Phantom<small>headphone pitch</small></button>
      <button aria-pressed="false" data-flv="UNMASK">Unmask<small>headphone clarity</small></button>
      <button aria-pressed="false" data-flv="ENVELOP">Envelop<small>wide low end</small></button>
      <button aria-pressed="false" data-flv="CURVE">Curve<small>bend the phase</small></button>
      <button aria-pressed="false" data-flv="DISPERSE">Disperse<small>spread in time</small></button>
    </div>

<section class="pro br" aria-label="Pro settings" id="propage" data-fx="grid"><canvas class="fx" aria-hidden="true"></canvas><span class="lbl-tab">Pro settings</span>
    <nav class="rail" aria-label="Pro sections" id="rail"></nav>
    <div class="panel" id="panel"></div>
  </section>
  <aside class="side br" aria-label="Main macro while in Pro"><span class="lbl-tab">Malignment</span>
    <div class="side-top">
      <div class="knob" id="k-main2" tabindex="0"></div>
      <div class="side-info"><div class="mini" id="readout2">Neutral</div><p class="side-sub" id="hsub2">Neutral · tracks summed as recorded</p></div>
    </div>
    <dl class="macrolist" id="macrolist"></dl>
  </aside>

  <div class="status br"><span class="lbl-tab">Session</span>
    <div class="pyrbox" aria-hidden="true"><canvas id="pyr" width="96" height="72"></canvas><div class="cap"><b>12</b> tracks<br><b>3</b> groups<br>ARA</div></div>
    <div id="log" aria-live="polite"><div>Ready</div></div>
    <div class="meters"><span class="meter">IN&nbsp; <i><b id="m-in"></b></i></span><span class="meter">OUT <i><b id="m-out"></b></i></span></div>
    <div class="src"><span id="sig" title="What drives the meters and the line grid">Demo signal</span><button id="aud" title="Play an audio file to drive the meters and the rainbow grid">Load audio</button><input type="file" id="audf" accept="audio/*" hidden><button id="sweep" aria-pressed="false" title="Sweep the main knob automatically">Sweep</button><span id="perf" title="Click to switch between 30 and 60 fps">— ms</span></div>
  </div>
</div>
<script>
(()=>{
'use strict';
const TAU=Math.PI*2, clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const ih=(x,z)=>((Math.imul(x,73856093)^Math.imul(z,19349663))>>>0)%1000/1000;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOON={x:828,y:74,R:56};
const BW=960,BH=540,HZ=300,PW=320,PH=180,HY=100;     // scene units (960x540); pixel world is 1/3 scale; horizon at y=300
let MONO_=null;const MONO=()=>MONO_||(MONO_=getComputedStyle(document.body).getPropertyValue('--mono').trim()||'monospace');

/* ================= state ================= */
const P={match:1,width:0.5,motion:0.35,mix:1,flavor:'FUSE',ab:false,delta:false,pro:false,flash:null};
const FLV=['FUSE','ERASE','GHOST','PHANTOM','UNMASK','ENVELOP','CURVE','DISPERSE'],FL={};FLV.forEach(k=>FL[k]=k==='FUSE'?1:0);
let MT=0,ABk=0,DLk=0,NT=0,LT=0,SLP=0;   // NT night (MIX down), LT house lights (MIX ~0), SLP the user asleep (MIX ~0 on malign)
const motF=()=>P.motion<0.35?lerp(0.12,1,P.motion/0.35):lerp(1,2.8,(P.motion-0.35)/0.65);

const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5], bay=(x,y)=>(BAY[(y&3)*4+(x&3)]+0.5)/16;

const pack=c=>((255<<24)|(c[2]<<16)|(c[1]<<8)|c[0])>>>0;
function ramp(cols,t,x,y){const n=cols.length-1,v=clamp(t)*n,i=Math.floor(v);return cols[Math.min(n,i+((v-i)>bay(x,y)?1:0))];}
function spr(w,h,f){const c=mk(w,h),g=c.getContext('2d'),id=g.createImageData(w,h),d=id.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const col=f(x,y);if(col){const i=(y*w+x)*4;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=col[3]===undefined?255:col[3];}}
  g.putImageData(id,0,0);return c;}
function blobSpr(w,h,blobs,cols,outline,lx=-0.6,ly=-0.8,noise=0.12){
  const inside=(x,y)=>{let best=null,bv=0;for(const b of blobs){const v=b[2]-Math.hypot(x-b[0],y-b[1]);if(v>bv){bv=v;best=b;}}return best;};
  return spr(w,h,(x,y)=>{const b=inside(x+0.5,y+0.5);if(!b)return null;
    if(outline&&(!inside(x+1.5,y+0.5)||!inside(x-0.5,y+0.5)||!inside(x+0.5,y+1.5)||!inside(x+0.5,y-0.5)))return outline;
    const t=0.5+0.6*(((x-b[0])*lx+(y-b[1])*ly)/b[2])+(hash(x*7.1+y*13.3)-0.5)*noise;return ramp(cols,t,x,y);});}
function fromRows(rows,map){const h=rows.length,w=Math.max(...rows.map(r=>r.length));return spr(w,h,(x,y)=>{const ch=rows[y][x];return ch&&map[ch]?hx(map[ch]):null;});}

function makeV(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;

  const nrm=spr(w,h,(x,y)=>{if(!A(x,y))return null;let nx=(L(x-1,y)-L(x+1,y))*1.5,ny=(L(x,y-1)-L(x,y+1))*1.5,nz=1;const l=Math.hypot(nx,ny,nz);
    return [((nx/l)*0.5+0.5)*255|0,((ny/l)*0.5+0.5)*255|0,((nz/l)*0.5+0.5)*255|0];});
  const miss=spr(w,h,(x,y)=>A(x,y)?((((x>>2)+(y>>2))&1)?[255,0,255]:[0,0,0]):null);

/* dither masks: binary per-pixel morphs instead of opacity fades */
const M0=[],M1=[];
function buildMasks(){for(let k=0;k<=16;k++){{const c=mk(4,4),g=c.getContext('2d');g.fillStyle='#000';for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(BAY[y*4+x]<k)g.fillRect(x,y,1,1);MR.push(rctx.createPattern(c,'repeat'));}const c=mk(4,4),g=c.getContext('2d');g.fillStyle='#000';for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(BAY[y*4+x]<k)g.fillRect(x,y,1,1);M0.push(s0.createPattern(c,'repeat'));M1.push(s1.createPattern(c,'repeat'));}}
// draw A, morphing into B by kb/16 of pixels, with kd/16 of pixels dissolved away
function blit(g,A,B,kb,kd,sx,sy,sw,sh,dx,dy,dw,dh){
  if(kd>=16||sw<1||sh<1)return;
  if(kd<=0&&(kb<=0||!B)){g.drawImage(A,sx,sy,sw,sh,dx,dy,dw,dh);return;}
  if(kd<=0&&kb>=16){g.drawImage(B,sx,sy,sw,sh,dx,dy,dw,dh);return;}
  s0.globalCompositeOperation='source-over';s0.clearRect(0,0,sw,sh);s0.drawImage(kb>=16?B:A,sx,sy,sw,sh,0,0,sw,sh);
  if(B&&kb>0&&kb<16){s1.globalCompositeOperation='source-over';s1.clearRect(0,0,sw,sh);s1.drawImage(B,sx,sy,sw,sh,0,0,sw,sh);
    s1.globalCompositeOperation='destination-in';s1.fillStyle=M1[kb];s1.fillRect(0,0,sw,sh);s1.globalCompositeOperation='source-over';s0.drawImage(SC1,0,0,sw,sh,0,0,sw,sh);}
  if(kd>0){s0.globalCompositeOperation='destination-out';s0.fillStyle=M0[kd];s0.fillRect(0,0,sw,sh);s0.globalCompositeOperation='source-over';}
  g.drawImage(SC0,0,0,sw,sh,dx,dy,dw,dh);}

function drawSpr(V,sx,sy,sw,sh,x,y,w,h,o){const g=wctx;if(w<0.6||h<0.6)return;
  g.save();g.translate(Math.round(x),Math.round(y));if(o.ang)g.rotate(o.ang);if(o.flip)g.scale(-1,1);
  const x0=-w/2,y0=-h/2;
  if(o.png>0){g.fillStyle=C.pngPat;g.fillRect(Math.round(x0)-1,Math.round(y0)-1,Math.round((w+2)*Math.min(1,o.png)),Math.round(h)+2);}
  if(o.ex>0&&V.sil&&(o.dis||0)<0.98){const T=Math.max(1,Math.round(o.ex*(1-(o.dis||0))*clamp(w*0.09,2,9))),dx=Math.cos(o.exA||0),dy=Math.sin(o.exA||0);
    for(let k=T;k>=1;k--)g.drawImage(V.sil,sx,sy,sw,sh,x0+Math.round(dx*k),y0+Math.round(dy*k),w,h);}
  const ti=Math.round(clamp(o.tex||0,0,2)*16),kd=Math.round(clamp(o.dis||0)*16);

  for(let y=0;y<H;y+=2){const j=Math.min(rows-1,(y/TY)|0),ly=y-j*TY;
    for(let x=0;x<W;x+=2){const i=Math.min(cols-1,(x/TX)|0),lx=x-i*TX;let px=GAP;
      if(lx>=gp/2&&lx<TX-gp/2&&ly>=gp/2&&ly<TY-gp/2){const n=(j*cols+i)*6;
        if(tp[n]>0){const tc=tp[n+2],ts=tp[n+3],ox=(lx-TX/2)/S,oy=(ly-TY/2)/S;
          const u=(x-W/2)/S+ox*tc-oy*ts-ox,v=(y-H/2)/S+ox*ts+oy*tc-oy;             // tile-local tilt of the shared field
          const ru=u*cr-v*sr,rr=Math.hypot(u,v)*2.2,ang=Math.atan2(v,u);
          const f=HM.bands*ru*4.2+HM.swirl*0.22*Math.sin(ang*2+rr*6-t*1.3)+HM.ripple*0.35*Math.sin(rr*14-t*3)+t*0.12+tp[n+1];
          const ph=f-Math.floor(f),shade=1-0.35*(ly/TY);                            // brushed metal: lit top, darker bottom
          let r=34*shade,gg=33*shade,b=38*shade;
          if(ph<BAND){const q=ph/BAND,k=Math.min(255,(q*255)|0)*3,e=Math.pow(Math.sin(Math.PI*q),0.55+soft)*HM.intensity*lit;
            r+=(CHROME_LUT[k]*HM.sat-r)*e;gg+=(CHROME_LUT[k+1]*HM.sat-gg)*e;b+=(CHROME_LUT[k+2]*HM.sat-b)*e;}
          const mk=tp[n+4],fl=tp[n+5],m=Math.max(mk,fl);                          // mouse / click: polished metal
          if(m>0){const dd=Math.hypot(lx/TX-0.3,ly/TY-0.25),mv=95+150*Math.max(0,1-dd*1.25);r+=(mv-r)*m;gg+=(mv-gg)*m;b+=(mv+6-b)*m;}
          r*=lit*0.85+0.15;gg*=lit*0.85+0.15;b*=lit*0.85+0.15;
          px=(255<<24)|(Math.min(255,b)<<16)|(Math.min(255,gg)<<8)|Math.min(255,r);}}
      d32[y*W+x]=px;if(x+1<W)d32[y*W+x+1]=px;if(y+1<H){d32[(y+1)*W+x]=px;if(x+1<W)d32[(y+1)*W+x+1]=px;}}}
  g.putImageData(fx.img,0,0);
  // tile edges: thin chromatic fringes and metal edge reflections, then the twinkles
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const n=(j*cols+i)*6;if(!tp[n])continue;
    const x0=i*TX+gp/2,y0=j*TY+gp/2,w=TX-gp,hh=TY-gp,cx=x0+w/2,cy=y0+hh/2;
    g.globalAlpha=HM.edgeRefl*lit;g.fillStyle=rgba(HM.metal,1);g.fillRect(x0,y0,w,1);g.fillRect(x0,y0,1,hh);
    const hue=((i*47+j*29+t*40)%360+360)%360;g.globalAlpha=0.55*lit;
    g.fillStyle=`hsl(${hue|0},95%,60%)`;g.fillRect(x0+w-1,y0,1,hh);g.fillStyle=`hsl(${(hue+120)%360|0},95%,60%)`;g.fillRect(x0,y0+hh-1,w,1);
    if(!rest&&on>0.5){const mt=(fx.mt||0)*HM.twinkleRate+hash(i*1.7+j*2.9)*7,slot=Math.floor(mt),fr=mt-slot;
      if(hash(i*13.3+j*7.7+slot*0.37)<0.06*HM.glitter){const a=Math.sin(Math.PI*fr)*on,ox=hash(i*3.3+slot)*w,oy=hash(j*4.1+slot)*hh;
        g.globalAlpha=a*0.9;g.fillStyle='#fff';g.fillRect(x0+ox-0.75,y0+oy-0.75,1.5,1.5);}}}
  g.globalAlpha=1;fx.flips=fx.flips.filter(fl=>fx.t-fl.t<2);}
{const hs=[...document.querySelectorAll('[data-fx="grid"] canvas.fx')].map(c=>c.getBoundingClientRect().height).filter(h=>h>0);if(hs.length)GRID_CELL_PX=Math.min(...hs)/GS.cells;}
function fitFlavourType(){const bs=[...document.querySelectorAll('.flavor button')];if(!bs.length||!bs[0].clientWidth)return;
  const fl=document.querySelector('.flavor');fl.style.setProperty('--flv-fs','24px');

    const wpx=rg.getBoundingClientRect().width*(b.clientWidth/(b.getBoundingClientRect().width||1));worst=Math.max(worst,wpx/(b.clientWidth-16));}
  if(worst>0)fl.style.setProperty('--flv-fs',`${Math.max(14,Math.min(34,24*0.78/worst)).toFixed(1)}px`);}

/* ================= editable values (click a value to type an exact number) ================= */
function editable(el,{get,set,parse,fmt}){el.classList.add('ed');el.tabIndex=0;el.title='Click to type a value';
  const open=()=>{if(el.querySelector('input'))return;const inp=document.createElement('input');inp.className='ed-in';inp.value=fmt(get());const keep=el.innerHTML;el.innerHTML='';el.appendChild(inp);inp.focus();inp.select();
    const done=ok=>{if(ok){const v=parse(inp.value);if(v!=null&&!isNaN(v))set(v);}el.innerHTML=keep;if(ok)set(get());el.focus();};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done(true);}else if(e.key==='Escape'){e.preventDefault();done(false);}e.stopPropagation();});
    inp.addEventListener('blur',()=>{if(el.contains(inp))done(true);});};
  el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();open();}});}
const num=t=>{const m=String(t).replace(',','.').replace('−','-').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null;};
for(const id of ['match','width','motion','mix'])editable(document.getElementById('v-'+id),{get:()=>MAC[id].get(),set:v=>MAC[id].set(clamp(v)),fmt:v=>Math.round(v*100),parse:t=>{const n=num(t);return n==null?null:n/100;}});
editable(document.getElementById('readout'),{get:()=>main.get(),set:v=>main.set(clamp(v)),fmt:v=>{const n=Math.round((v-0.5)*200);return (n>0?'+':'')+n;},
  parse:t=>{const n=num(t);return n==null?null:0.5+clamp(n,-100,100)/200;}});
const sweepBtn=document.getElementById('sweep');

sweepBtn.addEventListener('click',()=>{if(S.sweep)return stopSweep();S.sweep={t0:performance.now()};sweepBtn.setAttribute('aria-pressed','true');});

  const src=AU.ac.createMediaElementSource(AU.el);AU.an=AU.ac.createAnalyser();AU.an.fftSize=1024;AU.an.smoothingTimeConstant=0.72;src.connect(AU.an);AU.an.connect(AU.ac.destination);
  AU.fd=new Uint8Array(AU.an.frequencyBinCount);AU.td=new Float32Array(AU.an.fftSize);AU.ac.resume();AU.el.play();sigEl.textContent=f.name;audBtn.textContent='Pause audio';}catch(e){toast('err','audio · could not open file');}});
// stage pointer: gaze, grass hover, petting, poking the user
view.addEventListener('pointermove',e=>{const r=view.getBoundingClientRect();S.mx=(e.clientX-r.left)/r.width*BW;S.my=(e.clientY-r.top)/r.height*BH;
  if(!S.min&&faceQ()>=1&&SLP<0.5&&!FS.say&&S.t-FS.lastSay>4&&Math.random()<0.6)say(0,S.t);S.min=true;S.mt=S.t;});

/* ================= loop: capped fps, paused when hidden or off-screen ================= */
let visible=true,ms=0,msN=0,lastPerf=0,raf=0;
// In embedded viewers (iframes inside scroll containers) IntersectionObserver can report "not visible" while the
// scene is on screen, which froze the animation. Trust it only when the stage is also outside the page viewport,
// and keep a watchdog that restarts the loop if it ever stops while the page is visible.
const onScreen=()=>{const r=view.getBoundingClientRect();return r.bottom>0&&r.right>0&&r.top<innerHeight&&r.left<innerWidth;};
new IntersectionObserver(es=>{visible=es[0].isIntersecting||onScreen();if(visible&&!raf)raf=requestAnimationFrame(loop);}).observe(view);
setInterval(()=>{if(!document.hidden){if(!visible)visible=onScreen();if(visible&&!raf)raf=requestAnimationFrame(loop);}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!raf)raf=requestAnimationFrame(loop);});
function frame(now,dt){if(S.focus||S.idle){if(!S.dirty)return;S.dirty=false;const t0=performance.now();for(let k=0;k<20;k++)step(1/30);render(now);uiTick(now);perfEl.textContent=`${(performance.now()-t0).toFixed(1)} ms · still`;return;}
  drawPyr(S.t);if(S.sweep){const p=((now-S.sweep.t0)/24000)%1;main.set(0.5+0.5*Math.sin(p*TAU));}
  const t0=performance.now();step(dt);render(now);uiTick(now);ms+=performance.now()-t0;msN++;
  if(now-lastPerf>500){perfEl.textContent=`${(ms/msN).toFixed(1)} ms · ${S.fps} fps`;ms=0;msN=0;lastPerf=now;}}
function loop(now){raf=0;if(document.hidden||!visible)return;raf=requestAnimationFrame(loop);
  const dt=Math.min(0.1,(now-(S.last||now))/1000);S.last=now;S.acc+=dt;if(S.acc<1/S.fps-0.002)return;const d=S.acc;S.acc=0;frame(now,d);}
window.addEventListener('resize',resizeView);

resizeView();grassBands();buildMasks();buildCaches();buildSprites();buildBodies();CH_B=BODIES.filter(b=>b.kind==='chunk');setV(0.5);step(1/30);render(performance.now());raf=requestAnimationFrame(loop);
